name: Build and deploy
'on':
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build -- --base /graphql-explorer/ --outDir build/graphql-explorer
        env:
          REACT_APP_VERSION: ${{ github.sha }}
          REACT_APP_ENTUR_CLIENT_NAME: entur-shamash2023
      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build
    runs-on: ubuntu-latest

  deploy_dev:
    needs: [build]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@92840f7854647f3bb6922d0a1cec093c901bd98f # v1.2.7
    with:
      gcp_project_id: ent-shamash-dev
      environment: dev
      build_artifact_name: build
      build_artifact_path: build

  deploy_staging:
    needs: [deploy_dev]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@92840f7854647f3bb6922d0a1cec093c901bd98f # v1.2.7
    with:
      gcp_project_id: ent-shamash-tst
      environment: tst
      build_artifact_name: build
      build_artifact_path: build

  deploy_prod:
    needs: [deploy_dev, deploy_staging]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@92840f7854647f3bb6922d0a1cec093c901bd98f # v1.2.7
    with:
      gcp_project_id: ent-shamash-prd
      environment: prd
      build_artifact_name: build
      build_artifact_path: build
