name: Build and deploy
'on':
  push:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build -- --base /graphql-explorer/ --outDir build/graphql-explorer
        env:
          REACT_APP_VERSION: ${{ github.sha }}
          REACT_APP_ENTUR_CLIENT_NAME: entur-shamash2023
      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build
    runs-on: ubuntu-latest

  deploy_dev:
    needs: [build]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-shamash-dev
      environment: dev
      build_artifact_name: build
      build_artifact_path: build

  deploy_staging:
    needs: [deploy_dev]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-shamash-tst
      environment: tst
      build_artifact_name: build
      build_artifact_path: build

  deploy_prod:
    needs: [deploy_dev, deploy_staging]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-shamash-prd
      environment: prd
      build_artifact_name: build
      build_artifact_path: build
