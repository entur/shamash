name: Pull request build and deploy
'on': pull_request
jobs:
  build:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
        env:
          REACT_APP_VERSION: ${{ github.sha }}
          REACT_APP_ENTUR_CLIENT_NAME: entur-shamash2023
          PUBLIC_URL: ''
      - name: Archive production artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: |
            build

  preview:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    needs: [build]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-preview.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-shamash-dev
      environment: dev
      build_artifact_name: build
      build_artifact_path: build
