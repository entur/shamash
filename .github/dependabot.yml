# One PR per dependency so Freyja can assess and merge it (no groups).
# 4 day cooldown, except for the Entur packages listed under exclude.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
      exclude: ["@entur/*"]
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Oslo"
    open-pull-requests-limit: 100
    cooldown:
      default-days: 4
      exclude: ["entur/*"]
    commit-message:
      prefix: "chore"
      include: "scope"
